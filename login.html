<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SalinTala</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="../assets/js/app.js"></script>
</head>
<body class="auth">

  <div class="auth-top"><button class="icon-btn" id="theme" title="Toggle theme"><i class="bi bi-moon-stars"></i></button></div>

  <div class="cardx auth-card">
    <div class="text-center mb-4">
      <img src="../assets/images/logo.svg" alt="" width="56" height="56" class="mb-3">
      <h3 class="fw-bold mb-1">Welcome back</h3>
      <p class="muted mb-0">Log in to your SalinTala account</p>
    </div>

    <form id="form">
      <label for="email" class="form-label small fw-semibold">Email</label>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="you@ustp.edu.ph" required>
      </div>

      <label for="password" class="form-label small fw-semibold">Password</label>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="Your password" style="border-radius:0" required>
        <span class="input-group-text pw-toggle" id="toggle" role="button" tabindex="0">Show</span>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label small" for="remember">Remember me</label>
      </div>

      <button type="submit" class="go go-lg w-100" id="btn">
        <span id="btnText">Login</span><i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="divider">New to SalinTala?</div>
    <a href="signup.html" class="btn-outline-soft"><i class="bi bi-person-plus me-1"></i> Create an account</a>

    <p class="text-center mt-3 mb-0 small"><a href="../index.html" class="muted"><i class="bi bi-arrow-left"></i> Back to home</a></p>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script>
    var pw = document.getElementById("password"), tg = document.getElementById("toggle");
    function flip() {
      var show = pw.type === "password";
      pw.type = show ? "text" : "password";
      tg.textContent = show ? "Hide" : "Show";
    }
    tg.addEventListener("click", flip);
    tg.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });

    // Loading state, then go to the dashboard (demo: no real account check yet)
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = document.getElementById("btn");
      btn.disabled = true;
      document.getElementById("btnText").textContent = "Logging in...";
      btn.querySelector("i").outerHTML = '<i class="bi bi-arrow-repeat spin"></i>';
      setTimeout(function () { location.href = "dashboard.html"; }, 700);
    });
  </script>
</body>
</html>
